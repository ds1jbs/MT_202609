const GROUPS=['1TV','2TV','UHD','멀티','NQC'];
const SHIFT={조근:{marks:['◎','ⓩ']},일근:{marks:['○','ⓘ','◐','◑','◇','◆','○2']},야근:{marks:['●','ⓨ','●2']}};
const ORDER=['조근','일근','야근'];
/* 엑셀만으로 순환 판별이 어려운 대근·연속 휴가 예외는 확정 근무표 기준으로 지정 */
const VACATION_OVERRIDE={'9|29|최태원':'야근'};
let DATA=MONTHS['9'],curD=1;
function gnorm(s){return String(s||'').replace(/\s/g,'').toUpperCase()}
function daysInMonth(){return Math.max(...Object.keys(DATA.dow).map(Number))}
function norm(v){return String(v||'').replace(/\s|\(OJT\)/g,'').replace(/\n/g,'')}
function matches(v,s){const n=norm(v);return SHIFT[s].marks.some(m=>n===m||n.startsWith(m))}
function personName(r,d){return (r.byday&&r.byday[d])||r.name||''}
function initDay(){const t=new Date();curD=(t.getFullYear()===DATA.year&&t.getMonth()+1===DATA.month)?Math.min(t.getDate(),daysInMonth()):1}
function head(){document.getElementById('ym').textContent=DATA.year+'년 '+DATA.month+'월 · 미디어송출부'}
function buildMonths(){const el=document.getElementById('monthTabs');el.innerHTML='';Object.keys(MONTHS).forEach(k=>{const b=document.createElement('button');b.textContent=k+'월';b.className=DATA.month===+k?'on':'';b.onclick=()=>{DATA=MONTHS[k];initDay();head();buildMonths();buildDates();render();todayButton();};el.appendChild(b)})}
function buildDates(){const el=document.getElementById('dates');el.innerHTML='';for(let d=1;d<=daysInMonth();d++){let w=DATA.dow[d]||'';let x=document.createElement('div');x.className='dchip'+(d===curD?' on':'')+(w==='토'?' sat':w==='일'?' sun':'');x.dataset.d=d;x.innerHTML='<b>'+d+'</b><span>'+w+'</span>';el.appendChild(x)}centerChip(false)}
function centerChip(smooth){const el=document.getElementById('dates'),on=el.querySelector('.dchip.on');if(!on)return;const left=on.offsetLeft-(el.clientWidth-on.offsetWidth)/2;try{smooth?el.scrollTo({left,behavior:'smooth'}):el.scrollLeft=left}catch(e){el.scrollLeft=left}}
function setDay(d,smooth){curD=Math.min(Math.max(d,1),daysInMonth());buildDates();render();if(smooth)centerChip(true)}
function shiftClass(v){const n=norm(v);if(n.startsWith('X'))return'비번';for(const s of ORDER)if(SHIFT[s].marks.some(m=>n===m||n.startsWith(m)))return s;return ''}
function offLabel(v){v=String(v||'');if(/휴직/.test(v))return'휴직';if(/휴가/.test(v))return'휴가';if(/반차/.test(v))return'반차';if(/검/.test(v))return'검진';if(/교육/.test(v))return'교육';if(/출장/.test(v))return'출장';return''}
function priorDuty(next,days){let x=next,back={일근:'비번',야근:'일근',조근:'야근',비번:'조근'};for(let i=0;i<days;i++)x=back[x]||'';return x}
function vacationDuty(r){const fixed=VACATION_OVERRIDE[DATA.month+'|'+curD+'|'+r.name];if(fixed)return fixed;const prev=shiftClass(r.d[curD-1]);if(prev==='일근')return'야근';if(prev==='야근')return'조근';if(prev==='조근')return'';let future=[];for(let d=curD+1;d<=daysInMonth();d++)future.push([d-curD,r.d[d]]);const nm=MONTHS[String(DATA.month+1)];if(nm){const rr=nm.rows.find(x=>x.name===r.name&&x.g===r.g&&x.sub===r.sub);if(rr)for(let d=1;d<=7;d++)future.push([daysInMonth()-curD+d,rr.d[d]])}for(const [gap,v] of future){const nx=shiftClass(v);if(nx){const z=priorDuty(nx,gap);return z==='비번'?'':z}}return''}
function renderVac(){const list=[];DATA.rows.forEach(r=>{const lb=offLabel(r.d[curD]);if(!lb)return;let pre=lb==='휴가'?vacationDuty(r):'';list.push({nm:personName(r,curD),g:r.g,lb,pre})});const box=document.getElementById('vac');let h='<div class="vhead"><span>휴가, 부재</span><em>'+(list.length?list.length+'명':'없음')+'</em></div>';h+=list.length?'<div class="vbody">'+list.map(p=>'<div class="vchip">'+p.nm+'<i>'+p.g+'</i><u class="'+(p.pre==='조근'?'s0':p.pre==='일근'?'s1':p.pre==='야근'?'s2':'')+'">'+(p.pre?p.pre:'')+p.lb+'</u></div>').join('')+'</div>':'<div class="vnone">해당일 휴가, 부재자가 없습니다.</div>';box.innerHTML=h}
function render(){const out=document.getElementById('out');out.innerHTML='';GROUPS.forEach(g=>{const cols=ORDER.map(s=>DATA.rows.filter(r=>gnorm(r.g)===gnorm(g)&&r.d[curD]&&matches(r.d[curD],s)));const total=cols.reduce((a,x)=>a+x.length,0),box=document.createElement('div');box.className='grp';box.innerHTML='<div class="ghead"><span>'+g+'</span><b><i class="n0">'+cols[0].length+'</i>·<i class="n1">'+cols[1].length+'</i>·<i class="n2">'+cols[2].length+'</i> <em>('+total+'명)</em></b></div>';let h='<div class="cols">';cols.forEach((list,i)=>{h+='<div class="col">';if(!list.length)h+='<div class="none">–</div>';list.forEach(r=>{let v=String(r.d[curD]).replace(/\n/g,' ');h+='<div class="pcard c'+i+'"><span class="pn">'+personName(r,curD)+(r.sub?'<i>'+r.sub.replace('지원(시스템)','지원')+'</i>':'')+'</span><span class="pm'+(/2|ⓘ|ⓨ|ⓩ|◐|◑|◇|◆/.test(v)||r.sub==='지원(시스템)'?' sup':'')+'">'+v+'</span></div>'});h+='</div>'});box.insertAdjacentHTML('beforeend',h+'</div>');out.appendChild(box)});renderVac()}
function todayButton(){let b=document.getElementById('todaybtn'),t=new Date(),same=t.getFullYear()===DATA.year&&t.getMonth()+1===DATA.month;b.textContent=same?'오늘':'1일';b.classList.toggle('off',!same);b.onclick=()=>setDay(same?t.getDate():1,true)}
function initSlider(){const e=document.getElementById('dates');e.addEventListener('click',x=>{const c=x.target.closest('.dchip');if(c)setDay(+c.dataset.d,true)});document.getElementById('prev').onclick=()=>setDay(curD-1,true);document.getElementById('next').onclick=()=>setDay(curD+1,true);document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')setDay(curD-1,true);if(e.key==='ArrowRight')setDay(curD+1,true)})}
initDay();head();buildMonths();buildDates();render();todayButton();initSlider();
</script></body></html>
