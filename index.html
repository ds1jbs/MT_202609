const systemMonth=new Date();let DATA=Object.values(MONTHS).find(m=>m.year===systemMonth.getFullYear()&&m.month===systemMonth.getMonth()+1)||Object.values(MONTHS).slice(-1)[0],curD=1;
function gnorm(s){return String(s||'').replace(/\s/g,'').toUpperCase()}
function daysInMonth(){return Math.max(...Object.keys(DATA.dow).map(Number))}
function norm(v){return String(v||'').replace(/\s|\(OJT\)/g,'').replace(/\n/g,'')}
function matches(v,s){const n=norm(v);return SHIFT[s].marks.some(m=>n===m||n.startsWith(m))}

function initDay(){const t=new Date();curD=(t.getFullYear()===DATA.year&&t.getMonth()+1===DATA.month)?Math.min(t.getDate(),daysInMonth()):1}

function centerChip(smooth){const el=document.getElementById('dates'),on=el.querySelector('.dchip.on');if(!on)return;const left=on.offsetLeft-(el.clientWidth-on.offsetWidth)/2;try{smooth?el.scrollTo({left,behavior:'smooth'}):el.scrollLeft=left}catch(e){el.scrollLeft=left}}
function setDay(d,smooth){curD=Math.min(Math.max(d,1),daysInMonth());buildDates();render();if(smooth)centerChip(true)}
function shiftClass(v){const n=norm(v);if(n.startsWith('X'))return'비번';for(const s of ORDER)if(SHIFT[s].marks.some(m=>n===m||n.startsWith(m)))return s;return ''}
function offLabel(v){v=String(v||'');if(/휴직/.test(v))return'휴직';if(/휴가/.test(v))return'휴가';if(/반차/.test(v))return'반차';if(/검/.test(v))return'검진';if(/교육/.test(v))return'교육';if(/출장/.test(v))return'출장';return''}
function priorDuty(next,days){let x=next,back={일근:'비번',야근:'일근',조근:'야근',비번:'조근'};for(let i=0;i<days;i++)x=back[x]||'';return x}
function vacationDuty(r){
 const cycles=[['일근','야근','조근','비번'],['야근','조근','비번']];let best=null;
 for(const cycle of cycles)for(let phase=0;phase<cycle.length;phase++){
 let score=0,total=0;for(const k in r.d){const distance=Math.abs(Number(k)-curD);if(distance>10)continue;const v=norm(r.d[k]);if(/[ⓘⓨⓩ◐◑◇◆]/.test(v))continue;const actual=shiftClass(v);if(!actual)continue;const weight=1/(1+distance);total+=weight;if(actual===cycle[(Number(k)-1+phase)%cycle.length])score+=weight;}
 if(total&&(!best||score/total>best.fit))best={fit:score/total,duty:cycle[(curD-1+phase)%cycle.length]};
 }return best&&best.fit>=0.7&&best.duty!=='비번'?best.duty:'';
}
function renderVac(){const list=[];DATA.rows.forEach(r=>{const lb=offLabel(r.d[curD]);if(!lb)return;let pre=lb==='휴가'?vacationDuty(r):'';list.push({nm:personName(r,curD),g:r.g,lb,pre})});const box=document.getElementById('vac');let h='<div class="vhead"><span>휴가, 부재</span><em>'+(list.length?list.length+'명':'없음')+'</em></div>';h+=list.length?'<div class="vbody">'+list.map(p=>'<div class="vchip">'+p.nm+'<i>'+p.g+'</i><u class="'+(p.pre==='조근'?'s0':p.pre==='일근'?'s1':p.pre==='야근'?'s2':'')+'">'+(p.pre?p.pre:'')+p.lb+'</u></div>').join('')+'</div>':'<div class="vnone">해당일 휴가, 부재자가 없습니다.</div>';box.innerHTML=h}

function startAtSystemToday(){

function initZoom(){
 const phone=document.getElementById('phone');let scale=1,maxScale=1;
 try{const stored=Number(localStorage.getItem('duty-view-zoom'));if(stored>=0.8&&stored<=2)scale=stored}catch(e){}
 function apply(){
  const available=document.documentElement.clientWidth;
  const base=Math.min(430,available);
  maxScale=Math.min(2,Math.floor((available/base)*10)/10);
  scale=Math.max(0.8,Math.min(scale,maxScale));
  phone.style.setProperty('--base-width',base+'px');
  phone.style.setProperty('--app-zoom',String(scale));
  document.getElementById('zoomReset').textContent=Math.round(scale*100)+'%';
  document.getElementById('zoomMinus').disabled=scale<=0.8;
  document.getElementById('zoomPlus').disabled=scale>=maxScale;
  document.getElementById('zoomPlus').title='화면 폭 안에서 최대 '+Math.round(maxScale*100)+'%';
  try{localStorage.setItem('duty-view-zoom',String(scale))}catch(e){}
 }
 document.getElementById('zoomMinus').onclick=()=>{scale=Math.max(0.8,Math.round((scale-0.1)*10)/10);apply()};
 document.getElementById('zoomPlus').onclick=()=>{scale=Math.min(maxScale,Math.round((scale+0.1)*10)/10);apply()};
 document.getElementById('zoomReset').onclick=()=>{scale=1;apply()};
 window.addEventListener('resize',apply);apply();
}
initZoom();

function personalEvents(m,name,day){return m.rows.filter(r=>personName(r,day)===name&&r.d[day]).map(r=>{let raw=String(r.d[day]);let duty=shiftClass(raw);let label=raw==='X'?'비번':raw==='○'?'일근':raw==='●'?'야근':raw==='◎'?'조근':raw==='ⓘ'?'일근대근':raw==='ⓨ'?'야근대근':raw==='ⓩ'?'조근대근':raw;return {g:r.g,label,raw,sub:r.sub,duty}})}
function openPersonal(name){
 savedScroll=window.scrollY;hiddenPersonal=[];Array.from(document.getElementById('phone').children).forEach(el=>{if(el!==personalPanel&&el.tagName!=='SCRIPT'){hiddenPersonal.push([el,el.style.display]);el.style.display='none'}});
 const now=new Date();let h='<button class="backpersonal" type="button">← 전체 근무표로 돌아가기</button><h2 class="personal-title"><span class="personal-name">'+escapePersonal(name)+'</span><span class="personal-subtitle"> · 개인 근무표</span></h2>';
 Object.values(MONTHS).sort((a,b)=>a.year-b.year||a.month-b.month).forEach(m=>{let n=new Date(m.year,m.month,0).getDate(),offset=(new Date(m.year,m.month-1,1).getDay()+6)%7;h+='<section class="pmonth"><h3>'+m.year+'년 '+m.month+'월</h3><div class="pgrid">';['월','화','수','목','금','토','일'].forEach(w=>h+='<div class="pweekday">'+w+'</div>');for(let i=0;i<offset;i++)h+='<div class="pday"></div>';for(let d=1;d<=n;d++){const today=now.getFullYear()===m.year&&now.getMonth()+1===m.month&&now.getDate()===d;let events=personalEvents(m,name,d);h+='<div class="pday '+((offset+d-1)%7===6?'psunday':(offset+d-1)%7===5?'psaturday':'')+(holidayName(m.year,m.month,d)?' pholiday':'')+'"><span class="pnum '+(today?'today':'')+'">'+d+'</span>';h+=events.length?events.map(e=>'<div class="pevent '+(/휴가/.test(e.raw)?'pd-leave':e.duty==='일근'?'pd-day':e.duty==='야근'?'pd-night':e.duty==='조근'?'pd-early':e.raw==='X'?'pd-off':'')+'">'+escapePersonal(e.label)+'<br><span style="color:#91a1b9">'+escapePersonal(e.g)+(e.sub==='지원(시스템)'?' 지원':'')+'</span></div>').join(''):'<div class="pevent pempty">—</div>';h+='</div>'}for(let i=(offset+n)%7;i>0&&i<7;i++)h+='<div class="pday"></div>';h+='</div></section>'});
 h+='<div style="margin:16px 0 8px"><button class="backpersonal" type="button">← 전체 근무표로 돌아가기</button></div>';personalPanel.innerHTML=h;personalPanel.hidden=false;personalPanel.querySelectorAll('.backpersonal').forEach(button=>{button.onclick=()=>{personalPanel.hidden=true;hiddenPersonal.forEach(([el,display])=>el.style.display=display);window.scrollTo(0,savedScroll)}});window.scrollTo(0,0);
}
document.addEventListener('click',e=>{const el=e.target.closest('.pn,.vchip');if(!el)return;const name=Array.from(el.childNodes).filter(n=>n.nodeType===3).map(n=>n.textContent).join('').trim();if(name)openPersonal(name)});
</script><script>
function colorHolidayChips(){document.querySelectorAll('#dates .dchip').forEach(el=>{const b=el.querySelector('b');if(!b)return;const day=Number(b.textContent);const label=holidayName(DATA.year,DATA.month,day);if(label){el.classList.add('sun');el.title=label}})}
new MutationObserver(colorHolidayChips).observe(document.getElementById('dates'),{childList:true});colorHolidayChips();
