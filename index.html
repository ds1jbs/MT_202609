const ORIGINAL = JSON.stringify(DATA);
const LSKEY = "dutyboard_data_v1";

const GROUPS = ["1TV","2TV","UHD","멀티","NQC"];
function gnorm(s){ return String(s||"").replace(/\s/g,"").toUpperCase(); }
function groupList(){
  const out = GROUPS.slice();
  (DATA.rows||[]).forEach(r=>{ if(!out.some(g=>gnorm(g)===gnorm(r.g))) out.push(r.g); });
  return out;
}
const OFFTYPE = [
  {re:/휴직/,       label:"휴직"},
  {re:/휴가/,       label:"휴가"},
  {re:/검진|건\.검|건강검진/, label:"검진"},
  {re:/교육/,       label:"교육"},
  {re:/출장/,       label:"출장"}
];
function offLabel(v){
  const s=String(v||"");
  for(const o of OFFTYPE){ if(o.re.test(s)) return o.label; }
  return "";
}
const SHIFT = {
  "조근": {marks:["◎","ⓩ"]},
  "일근": {marks:["○","ⓘ","◐","◑","◇","◆","○2"]},
  "야근": {marks:["●","ⓨ","●2"]}
};
let curD = 1;
/* 붉은 라인 기준 : lastDay = 앞 근무자가 근무하는 마지막 날 (다음날부터 뒷사람) */
function lastDay(){ const v=+(DATA.lastDay); return (v>=1&&v<=31)?v:0; }
function hasSplitNames(o){ return (o.rows||[]).some(r=>String(r.name||"").indexOf("/")>=0); }
function personName(r, d){
  let nm = (r.byday && r.byday[d]) || r.name || "";
  if(nm.indexOf("/")>=0){
    const ps = nm.split("/").map(s=>s.trim()).filter(Boolean);
    if(ps.length>=2){ const L=(+(r.changeDay||r.lastDay)||lastDay()); nm = (L && +d > L) ? ps[ps.length-1] : ps[0]; }
  }
  return nm || "미지정";
}
const ORDER = ["조근","일근","야근"];

/* ---- 저장된 데이터 불러오기 ---- */
try{ const s = localStorage.getItem(LSKEY); if(s){ const o=JSON.parse(s); if(o&&o.rows) DATA=o; } }catch(e){}

function daysInMonth(){ return Math.max.apply(null, Object.keys(DATA.dow).map(Number)) || 31; }
function initDay(){
  const t=new Date(), nd=daysInMonth();
  curD = (t.getFullYear()===DATA.year && t.getMonth()+1===DATA.month) ? Math.min(t.getDate(),nd) : 1;
}
function norm(v){ return String(v).replace(/\s|\(OJT\)/g,"").replace(/\n/g,""); }
function matches(v, shift){
  const n = norm(v);
  return SHIFT[shift].marks.some(m => n === m || n.startsWith(m));
}
function head(){
  document.getElementById("ym").textContent = DATA.year+"년 "+DATA.month+"월 · "+(DATA.dept||"미디어송출부");
  const L=lastDay();
  document.getElementById("src").textContent =
    (L ? "2인 표기 기준일 : "+DATA.month+"월 "+L+"일까지 앞 근무자, "+(L+1)+"일부터 뒷 근무자" : "") +
    (DATA.srcName ? "\n출처: "+DATA.srcName : "");
}
function buildDates(){
  const el = document.getElementById("dates"); el.innerHTML="";
  const nd = daysInMonth();
  for(let d=1; d<=nd; d++){
    const w = DATA.dow[d] || "";
    const div = document.createElement("div");
    div.className = "dchip" + (d===curD?" on":"") + (w==="토"?" sat":"") + (w==="일"?" sun":"");
    div.innerHTML = "<b>"+d+"</b><span>"+w+"</span>";
    div.dataset.d = d;
    el.appendChild(div);
  }
  centerChip(false);
}
function centerChip(smooth){
  const el = document.getElementById("dates"), on = el.querySelector(".dchip.on");
  if(!on) return;
  const left = on.offsetLeft - (el.clientWidth - on.offsetWidth)/2;
  try{
    if(el.scrollTo && smooth) el.scrollTo({left:left, behavior:"smooth"});
    else el.scrollLeft = left;           // 구형 iOS 사파리 폴백
  }catch(e){ el.scrollLeft = left; }
}
function setDay(d, smooth){
  const nd = daysInMonth();
  if(d<1) d=1; if(d>nd) d=nd;
  curD = d;
  const el = document.getElementById("dates");
  el.querySelectorAll(".dchip").forEach(c=>c.classList.toggle("on", +c.dataset.d===curD));
  centerChip(smooth!==false); render();
}
/* 휴가가 아니었다면 했을 근무 추정 : 개인별 근무주기 자동 탐지 */
function shiftClass(v){
  const n = norm(v);
  if(n.indexOf("X")===0) return "비번";
  for(const s of ORDER){ if(SHIFT[s].marks.some(m => n===m || n.indexOf(m)===0)) return s; }
  return null;
}

  const known = {};
  let cnt = 0;
  for(const k in r.d){ const c = shiftClass(r.d[k]); if(c){ known[+k] = c; cnt++; } }
  if(cnt < 4) return null;
  let best = null;
  for(let p=2; p<=10; p++){
    const buckets = {};
    for(const k in known){
      const m = (+k) % p;
      (buckets[m] = buckets[m] || {})[known[k]] = ((buckets[m]||{})[known[k]] || 0) + 1;
    }
    let hit = 0;
    for(const m in buckets){
      let mx = 0; for(const v in buckets[m]) if(buckets[m][v] > mx) mx = buckets[m][v];
      hit += mx;
    }
    const score = hit/cnt - p*0.012;
    if(!best || score > best.score) best = {score:score, p:p, buckets:buckets};
  }
  if(!best || best.score < 0.72) return null;
  const b = best.buckets[day % best.p];
  if(!b) return null;
  let top=null, tot=0;
  for(const v in b){ tot += b[v]; if(!top || b[v] > b[top]) top = v; }
  if(!top || b[top]/tot < 0.6) return null;
  return top;                      // "조근" | "일근" | "야근" | "비번"
}

/* ================= 엑셀 파싱 ================= */
function cell(A,r,c){ const row=A[r]; if(!row) return ""; const v=row[c];
  return (v===undefined||v===null)?"":String(v).replace(/\n/g," ").trim(); }

function parseWorkbook(wb, fname){
  const ws = wb.Sheets[wb.SheetNames[0]];
  const A = XLSX.utils.sheet_to_json(ws, {header:1, raw:false, defval:""});

  // 1) '일자' 행과 '요일' 행 찾기
  let hr=-1, dc=-1;
  for(let r=0; r<Math.min(A.length,15) && hr<0; r++){
    for(let c=0; c<8; c++){
      if(cell(A,r,c).replace(/\s/g,"")==="일자"){ hr=r; dc=c+1; break; }
    }
  }
  if(hr<0) throw new Error("'일자' 머리글 행을 찾을 수 없습니다.");
  const wr = hr+1;

  // 2) 날짜 컬럼 매핑
  const dayCol={}, dow={};
  for(let c=dc; c<dc+45; c++){
    const n = parseInt(cell(A,hr,c),10);
    if(n>=1 && n<=31 && !dayCol[n]){ dayCol[n]=c; dow[n]=cell(A,wr,c)||""; }
  }
  const nd = Object.keys(dayCol).length;
  if(nd<28) throw new Error("날짜 컬럼이 "+nd+"개만 인식되었습니다.");

  // 3) 연·월
  let year=new Date().getFullYear(), month=0, dept="";
  for(let r=0; r<hr; r++) for(let c=0; c<6; c++){
    const m = cell(A,r,c).match(/(20\d\d)\s*년\s*(\d{1,2})\s*월/);
    if(m){ year=+m[1]; month=+m[2]; }
  }
  for(let r=0; r<hr; r++) for(let c=0; c<40; c++){
    const t=cell(A,r,c); if(/송출부|부$/.test(t) && t.length<=12 && !dept && /부/.test(t)) dept=t.replace(/\s*부장.*/,"").trim();
  }
  if(!month){ const mm=(fname||"").match(/(20\d\d)(\d\d)/); if(mm){ year=+mm[1]; month=+mm[2]; } }

  // 4) 근무자 행
  const rows=[]; let curG="", lastSub={};
  const gcol=dc-3>=0?dc-3:1, scol=dc-2, ncol=dc-1;
  for(let r=wr+1; r<A.length; r++){
    const g=cell(A,r,gcol).replace(/\s/g,""), sub=cell(A,r,scol), name=cell(A,r,ncol);
    if(g) curG=g;
    if(!curG) continue;
    const days={};
    for(const d in dayCol){ const v=cell(A,r,dayCol[d]); if(v) days[d]=v; }
    if(Object.keys(days).length===0) continue;
    const s = sub || lastSub[curG] || "";
    if(sub) lastSub[curG]=sub;
    if(name){ rows.push({g:curG, sub:s, name:name, d:days}); }
    else {
      // 이름 없는 지원 행 → 다음 행에서 날짜별 담당자 이름 읽기
      const byday={};
      for(const d in dayCol){ const v=cell(A,r+1,dayCol[d]); if(v) byday[d]=v; }
      rows.push({g:curG, sub:s||"지원(시스템)", name:"", d:days, byday:byday});
      r++;
    }
  }
  if(rows.length===0) throw new Error("근무자 행을 찾지 못했습니다.");
  return {year:year, month:month||1, dept:dept||"미디어송출부", dow:dow, rows:rows, lastDay:0, srcName:fname||""};
}

function handleFile(f){
  if(!f) return;
  if(typeof XLSX==="undefined"){ say("엑셀 해석 모듈(SheetJS)을 불러오지 못했습니다.\n인터넷에 연결된 상태에서 다시 열어주세요.","err"); return; }
  say("읽는 중… "+f.name);
  const fr=new FileReader();
  fr.onload=function(e){
    try{
      const wb=XLSX.read(new Uint8Array(e.target.result),{type:"array"});
      const nd=parseWorkbook(wb, f.name);
      const two = (nd.rows||[]).filter(r=>String(r.name||"").indexOf("/")>=0);
      if(two.length){
        nd.lastDay = 0;
        PENDING = nd;
        const names = two.slice(0,6).map(r=>r.g+" "+(r.sub||"")+" "+r.name).join("\n");
        document.getElementById("askinfo").innerHTML =
          "'/'로 두 명이 적힌 칸이 <b>"+two.length+"곳</b> 있습니다.<br>"+
          "<span style='color:#8b94a7'>"+names.replace(/\n/g,"<br>")+"</span><br><br>"+
          "<b>앞 근무자가 근무하는 마지막 날</b>을 입력하세요. 다음날부터 뒷 근무자로 표시됩니다.";

        document.getElementById("lastday").focus();
        say("① 기준일을 입력하고 [적용]을 누르세요.");
        return;
      }
      applyData(nd);
      say("✅ "+nd.year+"년 "+nd.month+"월 근무표 적용 완료 ("+nd.rows.length+"행)\n"+
          "· 이 기기에 저장 = 다음에 열 때도 유지\n· HTML 파일로 저장 = 공유용 단독 파일 생성","good");
    }catch(err){ say("❌ 해석 실패: "+err.message,"err"); }
  };
  fr.onerror=function(){ say("❌ 파일을 읽을 수 없습니다.","err"); };
  fr.readAsArrayBuffer(f);
}

                        "/*DATA_START*/"+JSON.stringify(DATA)+"/*DATA_END*/");

                (navigator.platform==="MacIntel" && navigator.maxTouchPoints>1);

}
